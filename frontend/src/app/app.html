<div class="app-shell" [attr.data-theme]="tema()">
  <aside class="sidebar">
    <a class="brand" routerLink="/tablero" aria-label="Trama, inicio">
      <span class="brand-mark" aria-hidden="true">t</span>
      <span class="brand-copy"><strong>trama</strong><small>tareas y proyectos</small></span>
    </a>

    <p class="nav-label">NAVEGACIÓN</p>
    <nav class="main-nav" aria-label="Navegación principal">
      <a routerLink="/tablero" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="nav-icon" aria-hidden="true">▦</span>
        <span>Tablero</span>
      </a>
      <a routerLink="/proyectos" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="nav-icon" aria-hidden="true">▤</span>
        <span>Proyectos</span>
      </a>
    </nav>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <span class="topbar-label">ORGANIZADOR PERSONAL</span>
      <div class="topbar-actions">
        <time>{{ fechaActual }}</time>
        <button
          class="theme-toggle"
          type="button"
          [attr.aria-label]="tema() === 'claro' ? 'Activar tema oscuro' : 'Activar tema claro'"
          [title]="tema() === 'claro' ? 'Tema oscuro' : 'Tema claro'"
          (click)="alternarTema()"
        >{{ tema() === 'claro' ? '◐' : '☼' }}</button>
      </div>
    </header>
    <section class="page-content">
      <router-outlet />
    </section>
  </main>
</div>
